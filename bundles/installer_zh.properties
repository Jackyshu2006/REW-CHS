V5_10_WARNING=<html><b>若您已安装 REW V5.10 或更早版本，强烈建议在执行此安装程序前先行卸载</b></html>
MEMORY_ALLOCATION_TITLE=选择 REW 运行时分配的内存量
MEMORY_ALLOCATION_SUGGESTION=大多数情况下 1 GB 已足够，但使用超过 1M 的扫频长度进行测量时可能需要更多内存
MEMORY_ALLOCATION_1GB=1 GB 适用于多数安装环境
MEMORY_ALLOCATION_WARNING=<B>注意：</B>若系统无法设置指定内存量，REW 将无法启动。<br>若发生此情况，请重新执行安装程序并选择较小的内存。<br><br>
MULTIPLE_INSTANCE_TITLE=选择单实例或多实例安装
MULTIPLE_INSTANCE_HINT=单实例是常规模式，即只运行一个 REW 实例
MULTIPLE_INSTANCE_BOX=允许同时运行多个 REW 实例
MULTIPLE_INSTANCE_BOX_HINT=允许多实例时，可同时运行多个 REW 实例。大多数情况下无需启用。
OPEN_GL_TITLE=选择 JVM 是否使用 OpenGL
OPEN_GL_HINT=若瀑布图生成发生错误请勾选此项
OPEN_GL_BOX=启用 OpenGL
OPEN_GL_BOX_HINT=<html>若生成瀑布图时出现以下错误：<br><br>\
Exception in thread "AWT-EventQueue-0" java.lang.InternalError: not implemented yet <br>\
at sun.java2d.xr.XRSurfaceData.getRaster(XRSurfaceData.java:72)<br><br>\
需强制 JVM 使用 OpenGL，勾选此项将在 <br>\
roomeqwizard.vmoptions 文件添加参数 (-Dsun.java2d.opengl=True)</html>
GRAPHICS_ACCELERATION_TITLE=选择 JVM 是否使用硬件图形加速
GRAPHICS_ACCELERATION_HINT=若遇到图形显示异常，请取消勾选此项
GRAPHICS_ACCELERATION_BOX=启用硬件图形加速
GRAPHICS_ACCELERATION_BOX_HINT=<html>若使用 REW 时发生画面异常，<br>停用硬件加速可能改善此状况。<br>\
取消勾选将在 roomeqwizard.vmoptions 文件<br>添加参数 (-Dsun.java2d.d3d=false)</html>
UNINSTALL_HINT=若要安装其他 REW 版本，无需删除日志文件
DELETE_PREFERENCES_BOX=删除 REW 设置
DELETE_PREFERENCES_HINT=勾选此项将移除所有已保存的 REW 设置
DELETE_LOG_FILES_BOX=删除 REW 日志文件及目录 ${installer:logfilesdir}
DELETE_LOG_FILES_HINT=<html>勾选此项后，REW 运行时创建的日志文件<br>及其所在的 REW 目录都会被删除</html>
