# Labels and tooltips for graph buttons

AXIS_LIN_LOG_HINT=在线性和对数之间切换频率轴  Ctrl+Shift+A
SET_LIMITS_HINT=设置图表坐标轴范围
SHOW_CONTROLS_HINT=显示图表选项
SHOW_CONTROLS_BUTTON=选项
SHOW_SCROLLBARS_HINT=显示图表滚动条
SHOW_SCROLLBARS_BUTTON=滚动条
CAPTURE_GRAPH_HINT=将图表另存为图片 (Alt+C)
CAPTURE_GRAPH_BUTTON=另存图片
AXIS_LIN_LOG_BUTTON=频率轴
SET_LIMITS_BUTTON=坐标轴范围
SEPARATE_TRACES_HINT=分离曲线
SEPARATE_TRACES_BUTTON=分离
VIEW_3D_BUTTON=3D
VIEW_3D_HINT=在 3D 查看器中打开数据
LIMITS_TITLE=设置图表坐标轴范围
LEFT=左
RIGHT=右
TOP=顶部
BOTTOM=底部
APPLY_SETTINGS=应用设置
FIT_TO_DATA=按数据调整范围
FIT_Y_TO_DATA=按数据调整 Y 轴
FIT_Y_HINT=按数据范围调整 Y 轴，保持 X 轴不变 (Ctrl+Alt+Y)
