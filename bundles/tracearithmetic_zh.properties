# Trace arithmetic panel

MEASUREMENT_SELECTOR_HINT=选择用于曲线运算的测量结果
MERGE_FREQUENCY_HINT=将曲线 B 合并到曲线 A 的频率
INVERSION_MAXIMUM_GAIN_HINT=求逆最大增益，0 至 {0} dB
LOWER_FREQUENCY_LIMIT_HINT=运算下限频率
UPPER_FREQUENCY_LIMIT_HINT=运算上限频率
TARGET_LEVEL_HINT=求逆的目标电平
GENERATE_BUTTON=生成
MERGE_FREQUENCY_NOT_VALID=合并频率无效
MERGE_FREQUENCY_PAST_END_TEMPLATE=所选合并频段超出 {0} 的末端
MERGE_FREQUENCY_BEFORE_START_TEMPLATE=所选合并频段位于 {0} 的起点之前
OPERATION_NOT_POSSIBLE_TEMPLATE=无法执行 {0} 操作
NO_PHASE_DATA=所选测量结果不包含相位数据
TARGET_LEVEL_LABEL=目标电平
