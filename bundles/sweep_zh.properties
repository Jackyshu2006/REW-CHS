# Strings for sweep controls and hints
START_FREQ_HINT=通道测量的起始频率，扫频最低频率为起始频率的一半
END_FREQ_HINT_TEMPLATE=通道测量的结束频率，{0} 至 {1} Hz。扫频最高频率为结束频率的两倍，上限为采样率的一半
TOTAL_TIME_HINT=所选扫频配置所需的总时间（扫频长度 × 扫频次数）
