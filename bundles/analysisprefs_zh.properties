# Analysis preferences elements not already covered by prefboxlabels and prefhints

IR_WINDOW_DEFAULTS_HEADING=IR 时间窗默认值
LEFT_SIDE_LABEL=左侧
RIGHT_SIDE_LABEL=右侧
DECAY_WATERFALL_LEFT_LABEL=IR 衰减/瀑布图左侧
DECAY_WATERFALL_RIGHT_LABEL=IR 衰减/瀑布图右侧
WATERFALL_AUDIO_DATA_LABEL=瀑布图 (音频数据)
SPECTROGRAM_LABEL=频谱图
FDW_UNITS_LABEL=FDW 单位:
IR_CALCULATION_HEADING=脉冲响应计算
FR_CALCULATION_HEADING=频率响应计算
IR_OVERSAMPLER_LABEL=IR 过采样器:
FDW_UNIT_HINT=频率相关时间窗宽度的单位
FDW_CYCLES_HINT=以周期数表示频率相关时间窗宽度（示例：100 Hz 时一个周期为 10 ms，1 kHz 时为 1 ms）
FDW_OCTAVES_HINT=以 1/倍频程表示频率相关时间窗宽度
IMPORT_T_ZERO_HINT=导入 IR 响应时 t=0 的处理方式
IR_TRUNCATION_HINT=测量后 IR 响应的截断处理
IR_OVERSAMPLING_HINT=IR 过采样所用的方法
DEFAULT_WIDTH_LABEL=默认宽度 (ms)
DEFAULT_SMOOTHING_HINT=应用于新测量结果的默认平滑处理
