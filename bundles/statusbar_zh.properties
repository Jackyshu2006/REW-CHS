# Main window status bar strings

MEMORY_USE_HINT=内存使用量
SAMPLE_RATE_HINT=音频接口采样率
INPUT_BIT_WIDTH_HINT=检测到的输入数据位宽
SAMPLE_FORMAT_HINT=采样格式
MAX_SPL_HINT=当前 SPL 校准下可测量的最大 SPL，点击显示校准数据
BIT_MONITOR_HINT=输入数据位监视器
INPUT_BIT_WIDTH_TEMPLATE={0} 位输入数据
MAX_SPL_TEMPLATE=最大输入 {0} dB SPL
MAX_SPL_UNCAL_TEMPLATE=最大输入 {0} dB SPL (未校准)
VRMS_IN_HINT=输入满量程正弦波 Vrms，点击显示校准数据
VRMS_OUT_HINT=输出满量程正弦波 Vrms，点击显示信号发生器
VRMS_IN_LABEL=输入满量程
VRMS_OUT_LABEL=输出满量程
