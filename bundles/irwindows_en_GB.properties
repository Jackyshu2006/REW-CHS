# IR Windows panel

IR_WINDOWS_TITLE=IR Windows
WINDOW_REF_NOT_AT_PEAK_TEMPLATE=Window ref is not at peak! ({0} ms)
LEFT_WINDOW_HINT=Duration of data in ms before window ref time to include in \
frequency response calculation
RIGHT_WINDOW_HINT=Duration of data in ms after window ref time to include in \
frequency response calculation
WINDOW_REF_HINT=Reference time for left and right windows, usually set to the time at which the impulse peak occurs
APPLY_TO_ALL_HINT=Apply these window settings to all the measurements
APPLY_TO_ALL_KEEP_REF_HINT=Apply these window settings to all the measurements, \
but leave each measurement's reference time unchanged
APPLY_TO_ALL_SPL_SELECTIONS_HINT=Apply these window settings to the selections in \
the main window's All SPL graph, leaving each measurement's reference time unchanged
APPLY_TO_IMPULSE_OVERLAY_SELECTIONS_HINT=Apply these window settings to the selections \
in the Impulse overlay graph, but leave each measurement's reference time unchanged
FREQUENCY_RESOLUTION_HINT=Frequency response resolution corresponding to the duration \
of the windowed impulse response, either total or right hand only depending on the \
setting of the "Use right window width for min valid frequency" Analysis preference
SPAN_IN_SAMPLES_HINT=Number of samples the windows span
FDW_NOT_AT_PEAK_WARNING_HINT=FDW may attenuate high frequencies if the reference \
time of the IR windows is not at the peak of the IR
MOVE_REF_TO_PEAK_BUTTON=Move ref to peak
MOVE_REF_TO_PEAK_HINT=Move the window ref to the IR peak
FREQUENCY_RESOLUTION_LABEL=Freq. resolution:
SPAN_IN_SAMPLES_LABEL=Span in samples:
LEFT_WIDTH_LABEL=Left width (ms):
REF_TIME_LABEL=Ref Time (ms):
RIGHT_WIDTH_LABEL=Right width (ms):
ADD_FDW_BOX=Add FDW
FDW_CYCLES_HINT=Frequency dependent window width in cycles - for example, at 100 \
Hz a cycle is 10 ms, at 1 kHz a cycle is 1 ms
FDW_OCTAVES_HINT=Frequency dependent window width in octaves
ADD_MTW_BOX=Add MTW
SAVE_SETTINGS_AS_PRESET_BUTTON=Save settings as preset
SAVE_SETTINGS_AS_PRESET_HINT=Save the current settings as a preset
APPLY_WINDOWS_TO_ALL_BUTTON=Apply windows to all
APPLY_TO_ALL_KEEP_REF_BUTTON=Apply to all, keep ref time
APPLY_TO_ALL_SPL_SELECTIONS_BUTTON=Apply to All SPL selections
APPLY_TO_IMPULSE_OVERLAY_SELECTIONS_BUTTON=Apply to Impulse overlay selections
LEFT_WINDOW_LABEL=Left:
RIGHT_WINDOW_LABEL=Right:
SHOW_PRESETS_BUTTON=Show presets
WINDOW_PRESETS_TITLE=IR Window presets
PRESETS_RESOLUTION_HEADING=Resn.
PRESET_NAME_HEADING=Preset name
PRESTES_LEFT_WINDOW_HEADING=Left window
PRESETS_WIDTH_HEADING=Width
PRESETS_RIGHT_WINDOW_HEADING=Right window
