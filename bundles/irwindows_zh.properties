# IR Windows panel
IR_WINDOWS_TITLE=IR 时间窗设置
WINDOW_REF_NOT_AT_PEAK_TEMPLATE=时间窗参考点未在峰值位置！({0} ms)
LEFT_WINDOW_HINT=左时间窗参考时间之前、用于频率响应计算的数据时长（毫秒）
RIGHT_WINDOW_HINT=右时间窗参考时间之后、用于频率响应计算的数据时长（毫秒）
WINDOW_REF_HINT=左右时间窗的参考时间，通常设为脉冲峰值出现的时刻
APPLY_TO_ALL_HINT=将当前时间窗设置应用至所有测量项目
APPLY_TO_ALL_KEEP_REF_HINT=应用时间窗设置至所有测量项目，保留各项目参考点位置
APPLY_TO_ALL_SPL_SELECTIONS_HINT=将这些时间窗设置应用到主窗口 All SPL 图的选中项，保留各测量的参考时间
APPLY_TO_IMPULSE_OVERLAY_SELECTIONS_HINT=将这些时间窗设置应用到脉冲响应叠加图的选中项，保留各测量的参考时间
FREQUENCY_RESOLUTION_HINT=与窗选脉冲响应时长对应的频率响应分辨率；取总时长或仅右时间窗宽度，取决于“使用右时间窗宽度计算最低有效频率”分析设置
SPAN_IN_SAMPLES_HINT=时间窗涵盖的采样点总数
FDW_NOT_AT_PEAK_WARNING_HINT=若时间窗参考点未对齐 IR 峰值，FDW 可能衰减高频
MOVE_REF_TO_PEAK_BUTTON=移动参考点至峰值
MOVE_REF_TO_PEAK_HINT=将时间窗参考点移至 IR 峰值位置
FREQUENCY_RESOLUTION_LABEL=频率分辨率：
SPAN_IN_SAMPLES_LABEL=采样点数：
LEFT_WIDTH_LABEL=时间窗起点宽 (ms)：
REF_TIME_LABEL=参考点位置 (ms)：
RIGHT_WIDTH_LABEL=时间窗终点宽 (ms)：
ADD_FDW_BOX=添加 FDW
FDW_CYCLES_HINT=FDW 宽度（周期数）- 例：100 Hz 时 1 周期=10 ms，1 kHz 时=1 ms
FDW_OCTAVES_HINT=频率相关时间窗宽度（倍频程）
ADD_MTW_BOX=添加 MTW
SAVE_SETTINGS_AS_PRESET_BUTTON=保存为预设配置
SAVE_SETTINGS_AS_PRESET_HINT=保存当前时间窗设置为预设配置
APPLY_WINDOWS_TO_ALL_BUTTON=应用时间窗至全部
APPLY_TO_ALL_KEEP_REF_BUTTON=应用至全部（保留参考点）
APPLY_TO_ALL_SPL_SELECTIONS_BUTTON=应用到 All SPL 选中项
APPLY_TO_IMPULSE_OVERLAY_SELECTIONS_BUTTON=应用到脉冲响应叠加图选中项
LEFT_WINDOW_LABEL=左：
RIGHT_WINDOW_LABEL=右：
SHOW_PRESETS_BUTTON=显示预设配置
WINDOW_PRESETS_TITLE=IR 时间窗预设配置
PRESETS_RESOLUTION_HEADING=分辨率
PRESET_NAME_HEADING=预设名称
PRESTES_LEFT_WINDOW_HEADING=左时间窗
PRESETS_WIDTH_HEADING=窗宽
PRESETS_RIGHT_WINDOW_HEADING=右时间窗
PRESETS_FDW_WIDTH_HEADING=FDW 窗宽
PRESETS_SELECT_BUTTON=选择
PRESETS_SELECT_HINT=选择此时间窗配置
PRESETS_DELETE_HINT=删除此配置
PRESETS_ADD_FDW_BOX=FDW
PRESETS_ADD_MTW_BOX=MTW
