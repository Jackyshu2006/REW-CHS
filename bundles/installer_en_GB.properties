V5_10_WARNING=<html><b>If you have REW V5.10 or earlier installed it is strongly \
recommended that you uninstall it before running this installer</b></html>
MEMORY_ALLOCATION_TITLE=Choose how much memory to allocate to REW when it runs
MEMORY_ALLOCATION_SUGGESTION=1 GB is sufficient for most uses but more may be needed \
if making measurements with sweep lengths above 1M
MEMORY_ALLOCATION_1GB=1 GB is suitable for most installations
MEMORY_ALLOCATION_WARNING=<B>Note:</B> If the amount of memory requested is not available \
to allocate REW will not start.<br>If that happens run the installer again and choose \
a smaller amount.<br><br>
MULTIPLE_INSTANCE_TITLE=Choose a single or multiple instance installation
MULTIPLE_INSTANCE_HINT=Single instance is the norm, which means only one copy of REW runs
MULTIPLE_INSTANCE_BOX=Allow multiple instances of REW
MULTIPLE_INSTANCE_BOX_HINT=If multiple instances are allowed more than one copy of \
REW can be running at once. In most cases this is not required.
OPEN_GL_TITLE=Choose whether the JVM should use OpenGL
OPEN_GL_HINT=Select this if waterfall generation causes an error
OPEN_GL_BOX=Use OpenGL
OPEN_GL_BOX_HINT=<html>If generating REW waterfall plots produces this error:<br><br>\
Exception in thread "AWT-EventQueue-0" java.lang.InternalError: not implemented yet <br>\
at sun.java2d.xr.XRSurfaceData.getRaster(XRSurfaceData.java:72)<br><br>\
the JVM may need instructing to use OpenGL, selecting this box adds an entry in the <br>\
roomeqwizard.vmoptions file (-Dsun.java2d.opengl=True) to do that.</html>
GRAPHICS_ACCELERATION_TITLE=Choose whether the JVM should use hardware graphics acceleration
GRAPHICS_ACCELERATION_HINT=Uncheck this if you experience graphics corruption
GRAPHICS_ACCELERATION_BOX=Use hardware graphics acceleration
GRAPHICS_ACCELERATION_BOX_HINT=<html>If graphics corruption occurs when using REW \
disabling hardware <br>gacceleration may help, deselecting this box adds an entry in <br>\
the roomeqwizard.vmoptions file (-Dsun.java2d.d3d=false) to do that.</html>
UNINSTALL_HINT=If you will be installing another REW version there is no need to remove the log files
DELETE_PREFERENCES_BOX=Delete REW preferences
DELETE_PREFERENCES_HINT=If this option is selected the saved REW preferences will be removed
DELETE_LOG_FILES_BOX=Delete REW log files and directory at ${installer:logfilesdir}
DELETE_LOG_FILES_HINT=<html>If this option is selected the log files REW creates when it<br> \
runs will be deleted along with the REW directory they are in</html>
