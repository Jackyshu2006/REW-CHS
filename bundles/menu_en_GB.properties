MULTI_INPUT_CAPTURE_TEXT=Multi-input capture allows REW to capture multiple inputs \
simultaneously for measurement or for the RTA. Individual SPL metering is available \
for the first four inputs. Measurements made with multi-input capture will show an \
rms average of all the captured channel magnitudes with an underlay showing the span \
of the individual channels and can optionally include individual measurements for each \
channel. The RTA shows an rms average of the individual channel magnitudes. A license \
is valid for a single user on any computer they use.
