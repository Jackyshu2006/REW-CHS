            <H2>推荐设备</H2>
        
            <P>做大多数声学测量时，最简单的配置是一支已校准的 USB 麦克风（例如 miniDSP UMIK-1），加上电脑的耳机输出或 HDMI 输出。如果用模拟测量麦克风，则需要一台带麦克风前置放大器和幻象电源的音频接口。<BR>
