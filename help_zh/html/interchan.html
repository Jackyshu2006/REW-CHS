        <H2><A name="top">相对增益与相位</A></H2>

        <P>信号发生器播放正弦信号时，本面板显示测量输入相对于参考输入的增益与相位，取值频率就是信号发生器当前输出的频率。

        如果两个通道送的是同一个信号，可以用这个面板检查通道间（inter-channel）的增益差和相位差。<BR><BR>
