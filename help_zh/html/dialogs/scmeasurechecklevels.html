<!DOCTYPE html>

<html>
    <HEAD>
        <META HTTP-EQUIV="CONTENT-TYPE" CONTENT="text/html; charset=UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <TITLE>声卡测量说明（检查电平）</TITLE>
        <link type="text/css" rel="stylesheet" href="../../../wizstyle.css">
    </HEAD>

  <BODY LANG="zh-CN" DIR="LTR">
    现在正在播放 1kHz 的测试音。请使用 REW 控件（若已启用且可用）、接口混音器或操作系统的音频音量控件来调整 <FONT CLASS="heading">输入音量</FONT>，使输入电平接近输出电平，理想情况下相差在 6dB 以内，且峰值电平（条形图上的红线）低于 -1dB。

    <P>如果输入音量控件已调至最大，但输入电平仍比输出电平低超过 6dB，请尝试使用 REW 控件（若已启用且可用）、接口混音器或操作系统的音频音量控件来提高 <FONT CLASS="heading">输出音量</FONT>。

    <P>输入音量设置完成后请按下 <B>下一步</B>，或按 <B>取消</B> 结束。
  </BODY>
</html>
