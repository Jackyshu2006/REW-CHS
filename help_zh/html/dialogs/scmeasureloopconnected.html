<!DOCTYPE html>

<html>
    <HEAD>
        <META HTTP-EQUIV="CONTENT-TYPE" CONTENT="text/html; charset=UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <TITLE>声卡测量说明（回路已连接）</TITLE>
        <link type="text/css" rel="stylesheet" href="../../../wizstyle.css">
    </HEAD>

  <BODY LANG="zh-CN" DIR="LTR">
    第一阶段是使用 1kHz 的测试音来设置测量信号的电平以及接口的输入音量。测试音会以目前的
    <FONT CLASS="heading">扫频电平</FONT> 设置来产生。进行接口测量时，最好使用相当高的电平，
    介于 -12 到 -6 dBFS 之间。请立即使用 <FONT CLASS="heading">扫频电平</FONT> 控件来设置此电平，
    原本的电平会在结束时恢复。

    <P>如果 REW 的音量控件可用且已启用，<FONT CLASS="heading">输出音量</FONT>
    若会影响信号电平，应设置在 0.5 左右。如果 REW 的音量控件不可用或未使用，
    请通过接口混音器或操作系统音频控制面板中的控件来设置电平。

    <P>当 <FONT CLASS="heading">扫频电平</FONT> 与
    <FONT CLASS="heading">输出音量</FONT> 设置完成后，请按下 <B>下一步</B>，或按 <B>取消</B> 结束。
  </BODY>
</html>
