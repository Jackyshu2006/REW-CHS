<!DOCTYPE html>

<html>
    <HEAD>
        <META HTTP-EQUIV="CONTENT-TYPE" CONTENT="text/html; charset=UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <TITLE>声卡测量说明</TITLE>
        <link type="text/css" rel="stylesheet" href="../../../wizstyle.css">
    </HEAD>

  <BODY LANG="zh-CN" DIR="LTR">
    音频接口需要连接回路来进行测量，以判断其频率响应并保存为校准文件。后续进行测量时，会将此响应扣除，以消除接口本身的响应。
    回路连接是从将用于测量的输出通道（通常是线路输出的右声道）连接到将用于测量的输入通道（通常是线路输入的右声道）。

    <P>请现在连接回路，完成后按下 <B>下一步</B>，或按 <B>取消</B> 结束。
  </BODY>
</html>
