    <BODY LANG="zh-CN" DIR="LTR">
        <H2><A name="top">帮助菜单</A></H2>
        <P><IMG SRC="../../images/helpmenu.jpg" ALT="帮助菜单" width="195" height="116"><BR CLEAR="All"><BR>

        <DL>
            <DT>显示帮助<FONT CLASS="keys"> F1</FONT>
            <DD>打开帮助窗口

            <DT>显示此项帮助<FONT CLASS="keys"> F2</FONT>
            <DD>显示你接下来点击的那个项目的帮助。进入这个模式后，鼠标光标旁会出现一个“?”。

            <DT>启动时检查更新
            <DD>勾选后，REW 每次启动都会检查有没有更新的版本<BR><BR>
            <IMG SRC="../../images/updatecheck.jpg" ALT="检查更新提示"><BR CLEAR="All"><BR>

            <DT>在启动检查中包含测试版
            <DD>勾选后，REW 每次启动还会检查有没有更新的测试版

            <DT>立即检查更新
            <DD>手动触发一次检查，立即查看有没有更新的版本

            <DT>生成诊断文件
            <DD>生成一个 zip 文件，里面包含 REW 的日志文件和一份声卡调试文件

            <DT>关于 REW（在 macOS 上位于应用程序菜单中）
            <DD>显示“关于”对话框<BR><BR>
            <IMG SRC="../../images/about.jpg" ALT="关于对话框"><BR CLEAR="All"><BR>

        </DL>
